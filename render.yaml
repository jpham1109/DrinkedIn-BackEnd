# Render Blueprint for the Kinpour Rails API (formerly DrinkedIn — see
# ai/deployment-plan.md's rebrand section; this infra pass only renames
# production resources, it does not touch in-app branding).
#
# Defines three resources: the Rails web service, the GoodJob worker
# (same image, different command — preserves the existing
# execution_mode: :external split between web/worker from
# config/environments/production.rb, matching docker-compose.yml's local
# dev setup), and a managed Postgres database. All three pinned to the
# same region (ohio) as the production S3 bucket, and as each other —
# same-region is what makes the `fromDatabase`/connectionString wiring
# below resolve to Render's private network instead of the public one.
#
# This is a best-effort Blueprint written against Render's documented
# syntax as of this writing (region/fromDatabase semantics verified
# directly against Render's current Blueprint docs this round) —
# validate it in the Render dashboard's "New Blueprint" flow (it will
# surface any schema errors directly) before relying on it.
#
# Deploy order matters: create this Blueprint first (or at least the web
# service), note its public URL, THEN set that URL as HOST_URL here and
# as REACT_APP_BACKEND_URL in the frontend repo's render.yaml before
# building the frontend — REACT_APP_BACKEND_URL is baked in at CRA build
# time, not read at runtime. Once kinpour.com/api.kinpour.com are live as
# custom domains, HOST_URL/CLIENT_URL move to those instead of the
# .onrender.com URLs — see ai/deployment-plan.md for that transition.
#
# See ai/deployment-plan.md (Phase5-DrinkedIn root) for the full
# account-setup steps, the least-privilege S3 IAM policy, required manual
# secrets, cost notes, and the deploy smoke-test procedure.

databases:
  - name: kinpour-db
    databaseName: kinpour_production
    user: kinpour
    region: ohio
    plan: starter # smallest paid tier — approved; the free Postgres plan
      # is time-limited, not viable for a real deploy. Confirm current
      # Starter pricing in your dashboard before provisioning; upgrade
      # memory only if verification shows a need.

services:
  # --- Rails API (web) ---
  - type: web
    name: kinpour-api
    runtime: docker
    region: ohio
    dockerfilePath: ./Dockerfile
    plan: starter # approved — always-on, no spin-down (the free Web
      # Service tier spins down after inactivity, which would also kill
      # the Puma process GoodJob's web side enqueues through). Confirm
      # current Starter pricing in your dashboard; upgrade memory only if
      # verification shows a need.
    healthCheckPath: /up
    # Runs once, on a single ephemeral instance, before any new web
    # instance takes traffic — the WEB service is the single migration
    # owner (bin/docker-entrypoint's RENDER-env guard steps aside in
    # favor of this). Deliberately NOT duplicated on the worker service
    # below — verified directly against this app's actual Rails 7.0.8
    # install that running `db:prepare` from both services concurrently
    # is not safe: on a fresh/empty database, db:prepare's schema-load
    # path (ActiveRecord::Tasks::DatabaseTasks#load_schema) has zero
    # concurrency protection at all (a real `relation already exists`
    # race risk); even once a schema exists, Rails' migration advisory
    # lock uses PostgreSQL's non-blocking `pg_try_advisory_lock` — the
    # losing process raises ActiveRecord::ConcurrentMigrationError and
    # exits nonzero rather than waiting its turn, which would fail that
    # service's deploy. See bin/wait-for-migrations (used by the worker
    # below) for how the worker instead waits for this to finish, rather
    # than racing it.
    #
    # `&& bundle exec rails db:seed` added 2026-11-17 (ai/v1-redesign-plan.md's
    # "Separate workstream: production seed safety") — deliberate, not a
    # reliance on db:prepare's own conditional seed-trigger. Verified
    # directly against this app's installed Rails 7.0.8 source that
    # db:prepare only auto-seeds when `migrate` raises
    # ActiveRecord::NoDatabaseError (the named database doesn't exist at
    # all) — Render provisions the Postgres database before the web
    # service's first boot, so that path likely never fires here, and
    # the Category taxonomy this seed step creates would otherwise never
    # get initialized in production. db/seeds.rb is now purely
    # idempotent (find_or_create_by! on Category only — no destructive
    # operations, no Users/Cocktails/sample data), so running it on
    # every single deploy is intentional and safe, not just tolerated.
    preDeployCommand: bundle exec rails db:prepare && bundle exec rails db:seed
    autoDeploy: true
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: 'true'
      - key: RAILS_SERVE_STATIC_FILES
        value: 'false' # frontend is a separate Static Site; Rails serves no assets
      - key: RAILS_MASTER_KEY
        sync: false # set manually in the dashboard — see
        # ai/deployment-plan.md's secrets section; this is the per-environment
        # production key, generated fresh, never the existing dev master key
      - key: DATABASE_URL
        fromDatabase:
          name: kinpour-db
          property: connectionString
      - key: HOST_URL
        value: '' # fill in once this service has a Render URL (or the
        # api.kinpour.com custom domain once that's live); required at
        # boot — see production.rb
      - key: CLIENT_URL
        value: '' # fill in with the frontend Static Site's exact URL (or
        # https://kinpour.com once live) — required for CORS
        # (config/initializers/cors.rb)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2 # Ohio — matches the Render region above and the
        # production S3 bucket's actual region
      - key: AWS_BUCKET
        sync: false # the user's existing bucket name — not a new resource

  # --- GoodJob worker ---
  # Same image as the web service; overrides the Dockerfile's default CMD
  # (`rails server`) to run the worker process instead — mirrors
  # docker-compose.yml's `worker` service exactly. Rails'
  # execution_mode: :external (production.rb) means jobs are ONLY
  # processed here, never in-process inside the web dyno.
  #
  # No preDeployCommand here, deliberately — see the web service's own
  # comment above for why running db:prepare from both services isn't
  # safe. Instead, dockerCommand starts bin/wait-for-migrations, which
  # blocks (bounded, ~5 minutes) until the database is reachable and has
  # no pending migrations, THEN execs `good_job start` — so a worker
  # that boots before the web service's preDeployCommand has finished
  # (a real possibility: Render deploys each service in a Blueprint
  # independently, with no ordering guarantee between them) waits
  # instead of racing or crash-looping against missing tables.
  - type: worker
    name: kinpour-worker
    runtime: docker
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerCommand: bin/wait-for-migrations
    plan: starter # approved. Render's free tier does not support
      # Background Worker services at all as of this writing — this plan
      # choice isn't optional the way it might be for the web service.
      # Confirm current Starter pricing in your dashboard; upgrade memory
      # only if verification shows a need.
    autoDeploy: true
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: 'true'
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kinpour-db
          property: connectionString
      - key: HOST_URL
        value: '' # same value as the web service's HOST_URL
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: AWS_BUCKET
        sync: false
